<!doctype html><html lang="fr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formation Auto-IA · Mes Cours IRT</title><meta name="theme-color" content="#05060F"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/th-python-ia.css"><style>
html[data-theme="dark"] body.fo{--paper:#05060F;--sheet:#0B0E1E;--sheet2:#111633;--line:#1F2547;--ink:#EEF1FF;--ink2:#9BA4CC;--ink3:#626C94}
html[data-theme="light"] body.fo{--paper:#EEF1FB;--sheet:#FFFFFF;--sheet2:#F1F4FC;--line:#D3DAEE;--ink:#141936;--ink2:#4E587E;--ink3:#8790B0}
body.fo{background:var(--paper);color:var(--ink);font-family:var(--f-x);margin:0;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
.fo *{box-sizing:border-box}
.fo-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
html[data-theme="light"] .fo-bg{opacity:.3}
.fo-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.fo .ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;text-decoration:none;flex:none}
.fo svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fo-brand{min-width:0;flex:1;line-height:1.05}.fo-brand b{font-family:var(--f-t);letter-spacing:.2em;font-size:1.05rem;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.fo-brand small{display:block;color:var(--ink2);font-size:.72rem}
.fo-timer{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--sheet));color:var(--ink);font-family:var(--f-c);font-weight:700;font-size:.95rem;cursor:pointer}
.fo-timer.over{border-color:#EF4444;background:color-mix(in srgb,#EF4444 18%,var(--sheet));animation:pul 1.2s infinite}
@keyframes pul{50%{box-shadow:0 0 0 6px color-mix(in srgb,#EF4444 25%,transparent)}}
.fo-main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px}
.fo-tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.fo-tabs a{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--ink2);font-size:.7rem;font-weight:700}
.fo-tabs a[aria-current]{color:var(--ink);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.fo-tabs a[aria-current] svg.i{color:var(--acc)}
/* héros */
.fh{position:relative;padding:20px 18px;border-radius:24px;border:1px solid var(--line);background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 55%),radial-gradient(120% 120% at 0% 100%,color-mix(in srgb,var(--acc2) 14%,transparent),transparent 55%),var(--sheet);overflow:hidden}
.fh .k{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.fh h1{font-family:var(--f-t);font-size:clamp(1.6rem,6.5vw,2.5rem);line-height:1.05;margin:8px 0 6px;letter-spacing:-.01em}
.fh p{color:var(--ink2);margin:0 0 14px;max-width:52ch}
.btnx{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 50%,var(--acc2)));box-shadow:0 14px 30px -14px var(--acc)}
.btnx.gh{background:var(--sheet2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btnx.ok{background:linear-gradient(135deg,#16A34A,#22C55E);box-shadow:0 14px 30px -14px #22C55E}
.btnx[disabled]{opacity:.45;cursor:not-allowed}
.btnx.wide{width:100%}
.week{display:flex;gap:6px;margin-top:14px}
.week span{flex:1;text-align:center;font-size:.66rem;font-weight:800;color:var(--ink3);padding:6px 0;border-radius:10px;border:1px dashed var(--line)}
.week span.on{color:var(--ink);border-style:solid;border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.week span.today{outline:2px solid var(--acc);outline-offset:1px}
.week span.did{background:color-mix(in srgb,#22C55E 22%,transparent);border-color:#22C55E;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kpis div{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.kpis b{display:block;font-family:var(--f-t);font-size:1.25rem}
.kpis small{color:var(--ink2);font-size:.66rem;font-weight:700}
@media(max-width:380px){.kpis b{font-size:1.05rem}}
/* carte du parcours */
.ph{margin-top:26px;--pc:var(--acc)}
.ph-h{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:14px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 24%,var(--sheet)),var(--sheet));border:1px solid color-mix(in srgb,var(--pc) 40%,var(--line))}
.ph-n{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-t);font-size:1.4rem;font-weight:700;color:#0B0B1A;background:var(--pc);box-shadow:0 10px 26px -10px var(--pc)}
.ph-h h2{font-family:var(--f-t);font-size:1.15rem;margin:0;line-height:1.15}
.ph-h p{margin:2px 0 0;color:var(--ink2);font-size:.8rem}
.ph-h .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chipx{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--pc,var(--acc)) 16%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--pc,var(--acc)) 30%,transparent)}
.chipx svg.i{width:12px;height:12px}
.ph.lock .ph-h{filter:saturate(.35);opacity:.75}
.path{position:relative;display:grid;gap:4px;padding:18px 0 4px;list-style:none;margin:0}
.path li{display:grid;grid-template-columns:1fr;justify-items:var(--j,center)}
.path li:nth-child(4n+1){--j:center}.path li:nth-child(4n+2){--j:start;padding-left:14%}.path li:nth-child(4n+3){--j:center}.path li:nth-child(4n){--j:end;padding-right:14%}
.node{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:none;border:0;font:inherit;text-align:left;cursor:pointer;max-width:330px;padding:4px}
.node .c{position:relative;width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--sheet2);border:3px solid var(--line);color:var(--ink3);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 80%,#000)}
.node .c svg.i{width:26px;height:26px}
.node .tx b{display:block;font-size:.88rem;line-height:1.2}
.node .tx small{color:var(--ink2);font-size:.7rem;font-weight:700}
.node.av .c{background:var(--pc);border-color:color-mix(in srgb,var(--pc) 60%,#fff);color:#0B0B1A;box-shadow:0 6px 0 color-mix(in srgb,var(--pc) 55%,#000),0 0 0 0 var(--pc);animation:ring 2s infinite}
@keyframes ring{0%{box-shadow:0 6px 0 color-mix(in srgb,var(--pc) 55%,#000),0 0 0 0 color-mix(in srgb,var(--pc) 60%,transparent)}100%{box-shadow:0 6px 0 color-mix(in srgb,var(--pc) 55%,#000),0 0 0 16px transparent}}
.node.wip .c{background:conic-gradient(var(--pc) var(--p,0%),var(--sheet2) 0);border-color:var(--pc);color:var(--ink)}
.node.done .c{background:linear-gradient(135deg,#22C55E,#16A34A);border-color:#4ADE80;color:#fff;box-shadow:0 6px 0 #166534}
.node.dev .c{border-radius:18px;transform:rotate(45deg)}.node.dev .c svg.i{transform:rotate(-45deg)}
.node.prep .tx small{color:var(--ink3)}
.node[disabled]{cursor:default}
/* module */
.mh{padding:18px;border-radius:22px;border:1px solid color-mix(in srgb,var(--pc) 45%,var(--line));background:radial-gradient(140% 120% at 100% 0%,color-mix(in srgb,var(--pc) 26%,transparent),transparent 60%),var(--sheet)}
.mh .k{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pc)}
.mh h1{font-family:var(--f-t);font-size:clamp(1.35rem,5.5vw,2rem);margin:6px 0;line-height:1.1}
.mh .acc{color:var(--ink2);margin:0 0 10px}
.mh ul{margin:6px 0 0;padding-left:18px;color:var(--ink2);font-size:.88rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.steps span{position:relative;text-align:center;font-size:.66rem;font-weight:800;color:var(--ink3);padding:8px 2px;border-radius:12px;background:var(--sheet);border:1px solid var(--line)}
.steps span.on{color:var(--ink);border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--sheet))}
.steps span.ok{color:#fff;background:#16A34A;border-color:#22C55E}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;animation:pop .45s var(--ease,cubic-bezier(.2,.8,.2,1))}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.card h3{font-family:var(--f-t);font-size:1.08rem;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.card h3 .no{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--pc);color:#0B0B1A;font-size:.85rem;flex:none}
.card.dim{opacity:.72}
.card.dim .md{max-height:110px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 40%,transparent)}
.card .md{font-size:.95rem}
.qx .q{font-weight:700;margin-bottom:10px;line-height:1.35}
.qx pre{background:var(--code-bg,#030407);color:#E6EDF3;border-radius:12px;padding:12px;overflow-x:auto;font-family:var(--f-c);font-size:.82rem;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--sheet2);color:var(--ink);font:inherit;cursor:pointer;line-height:1.3}
.opt:hover{border-color:color-mix(in srgb,var(--pc) 60%,var(--line))}
.opt.sel{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--sheet2))}
.opt.good{border-color:#22C55E;background:color-mix(in srgb,#22C55E 16%,var(--sheet2))}
.opt.bad{border-color:#EF4444;background:color-mix(in srgb,#EF4444 14%,var(--sheet2));animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.free{display:flex;gap:8px;margin-top:8px}.free input{flex:1;min-width:0;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--sheet2);color:var(--ink);font:inherit;font-family:var(--f-c)}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:.88rem;line-height:1.4}
.fb.g{background:color-mix(in srgb,#22C55E 14%,transparent);border:1px solid #22C55E}
.fb.b{background:color-mix(in srgb,#EF4444 12%,transparent);border:1px solid #EF4444}
.score{display:grid;place-items:center;text-align:center;padding:10px}
.score b{font-family:var(--f-t);font-size:3rem;line-height:1}
.banner{position:sticky;top:64px;z-index:5;margin-top:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,#EF4444 16%,var(--sheet));border:1px solid #EF4444;font-size:.85rem;font-weight:700}
.prep{padding:18px;border-radius:18px;border:1.5px dashed var(--line);color:var(--ink2);margin-top:12px}
/* projets */
.pf{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.pf::-webkit-scrollbar{display:none}
.pf button{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);color:var(--ink2);font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.pf button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.srch{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--sheet);margin-top:10px}
.srch input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;outline:none}
.pgrid{display:grid;gap:10px;margin-top:12px}
@media(min-width:700px){.pgrid{grid-template-columns:1fr 1fr}}
.pc{display:block;text-decoration:none;color:var(--ink);padding:14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 14%,var(--sheet)),var(--sheet));position:relative;overflow:hidden}
.pc .ptop{display:flex;align-items:center;gap:8px;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cc)}
.pc .ptop .n{margin-left:auto;font-family:var(--f-c);color:var(--ink3)}
.pc h3{font-size:1rem;margin:6px 0 4px;line-height:1.25}
.pc p{margin:0;color:var(--ink2);font-size:.82rem;line-height:1.35}
.pc .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.stars{letter-spacing:1px;color:#FBBF24;font-size:.8rem}
.pc .pg{position:absolute;left:0;bottom:0;height:3px;background:#22C55E}
.stp{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--sheet2);margin-top:8px;cursor:pointer}
.stp input{width:22px;height:22px;accent-color:#22C55E;flex:none;margin-top:1px}
.stp.ok{border-color:#22C55E;opacity:.8}.stp.ok span{text-decoration:line-through}
/* certifs */
.tl{position:relative;margin:14px 0 0;padding:0 0 0 22px;list-style:none}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--acc),var(--acc2))}
.tl li{position:relative;margin-bottom:10px}
.tl li::before{content:"";position:absolute;left:-19px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--acc)}
.tl li.paid::before{border-color:#FBBF24}.tl li.got::before{background:#22C55E;border-color:#22C55E}
.ce{padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--sheet)}
.ce h3{font-size:.95rem;margin:0}.ce .w{font-size:.72rem;color:var(--ink2);font-weight:700;margin-top:2px}
.ce p{margin:6px 0 0;font-size:.82rem;color:var(--ink2)}
.ce .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ce a{color:var(--acc);font-weight:700;font-size:.82rem}
/* réglages */
.set{display:grid;gap:10px}
.set .card{margin:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days label{flex:1;min-width:40px;text-align:center;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--sheet2);font-weight:800;font-size:.8rem;cursor:pointer}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label.on{background:var(--acc);border-color:var(--acc);color:#fff}
.swatch{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.swatch button{width:38px;height:38px;flex:none;border-radius:50%;border:3px solid var(--sheet);outline:2px solid transparent;cursor:pointer;background:var(--c);padding:0;transition:transform .25s,outline-color .25s}
.swatch button[aria-pressed="true"]{outline-color:var(--ink);transform:scale(1.12)}
.thm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thm button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--sheet2);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.thm button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.thm .pv{width:100%;height:46px;border-radius:10px;border:1px solid var(--line)}
.thm .pv.dk{background:linear-gradient(135deg,#05060F,#111633 60%,#4B8BFF)}.thm .pv.lt{background:linear-gradient(135deg,#FFFFFF,#EEF1FB 60%,#4B8BFF)}
.tgl{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--sheet2);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.tgl .tx{flex:1;font-size:.88rem;line-height:1.35}
.tgl .kn{position:relative;width:52px;height:30px;flex:none;border-radius:99px;background:var(--line);transition:background .3s}
.tgl .kn::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tgl[aria-checked="true"] .kn{background:linear-gradient(90deg,#16A34A,#22C55E)}.tgl[aria-checked="true"] .kn::after{transform:translateX(22px)}
.iod{margin-top:10px}.iod summary{cursor:pointer;font-size:.8rem;color:var(--ink2);font-weight:700}
.me{display:flex;align-items:center;gap:12px}.me .av{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-t);font-weight:800;font-size:1.2rem;color:#fff;background:linear-gradient(135deg,var(--acc),#22D3EE)}.me small{display:block;color:var(--ink2);font-size:.78rem}
.card.danger{border:2px solid #EF4444;background:linear-gradient(135deg,color-mix(in srgb,#EF4444 10%,var(--sheet)),var(--sheet))}.card.danger h3{color:#EF4444}
.btnx.red{background:linear-gradient(135deg,#DC2626,#F43F5E);box-shadow:0 14px 30px -14px #EF4444}
.fo-tabs a{font-size:.66rem}
/* vitrine */
.vt-hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px;border-radius:24px;border:1px solid var(--line);background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 60%),var(--sheet)}
.vt-av{position:relative;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc),#22D3EE,#F472B6,var(--acc));animation:spin 6s linear infinite}
.vt-av span{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);font-family:var(--f-t);font-weight:800;font-size:1.7rem;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(1turn)}}
.vt-id .k{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}.vt-id h1{font-family:var(--f-t);font-size:clamp(1.3rem,6vw,2rem);margin:4px 0 2px;line-height:1.1}.vt-id p{margin:0 0 6px;color:var(--ink2);font-size:.85rem}
.vt-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.vt-kpi div{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}.vt-kpi b{display:block;font-family:var(--f-t);font-size:1.3rem}.vt-kpi small{color:var(--ink2);font-size:.66rem;font-weight:700}
.vt-ph{display:grid;grid-template-columns:minmax(0,1fr) 34% 40px;gap:8px;align-items:center;font-size:.78rem;margin-top:6px}.vt-ph span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vt-ph .b{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.vt-ph .b i{display:block;height:100%;background:var(--pc)}.vt-ph .n{text-align:right;font-weight:800;color:var(--ink2)}
.vt-bdg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.vt-bdg span{padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--acc) 16%,transparent);font-size:.75rem;font-weight:800}
.vt-pj{padding:10px 0;border-top:1px dashed var(--line)}.vt-pj small{display:block;color:var(--ink2);font-size:.75rem}
.vt-bar{position:relative;height:12px;border-radius:99px;background:var(--line);margin:22px 0 4px}.vt-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F59E0B,#22C55E)}.vt-bar em{position:absolute;top:-18px;transform:translateX(-50%);font-size:.65rem;font-style:normal;font-weight:800;color:var(--ink2)}
.vt-act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.vt-act .btnx{flex:1 1 160px}
@media print{.fo-top,.fo-tabs,.fo-bg,.vt-act,.note{display:none!important}body.fo{background:#fff!important;color:#000;padding:0}.card,.vt-hero,.vt-kpi div{break-inside:avoid;box-shadow:none}}
/* séquence de lancement */
.boot{position:fixed;inset:0;z-index:850;display:grid;place-items:center;padding:16px;background:#03040A;color:#C8FFE0;transition:opacity .6s,transform .7s cubic-bezier(.7,0,.2,1);cursor:pointer}
.boot.out{opacity:0;transform:translateY(-6%)}
.bt-grid{position:absolute;inset:0;background:linear-gradient(rgba(34,211,238,.08) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(34,211,238,.08) 1px,transparent 1px) 0 0/28px 100%;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%);animation:btScroll 6s linear infinite}
@keyframes btScroll{to{background-position:0 280px,280px 0}}
.bt-box{position:relative;width:min(520px,100%);border:1px solid #1E4B5A;border-radius:16px;background:#060B14ee;box-shadow:0 0 60px -10px #22D3EE55;overflow:hidden}
.bt-h{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#0B1424;border-bottom:1px solid #1E4B5A;font-family:var(--f-c);font-size:.72rem;color:#6B8BA8}
.bt-h i{width:10px;height:10px;border-radius:50%;background:#EF4444}.bt-h i:nth-child(2){background:#FBBF24}.bt-h i:nth-child(3){background:#22C55E;margin-right:6px}
.boot pre{margin:0;padding:14px;min-height:120px;font-family:var(--f-c);font-size:.8rem;line-height:1.7;white-space:pre-wrap;color:#7DF9C4;text-shadow:0 0 8px #22C55E88}
.bt-p{height:4px;background:#0F2233}.bt-p i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22D3EE,#A78BFA);transition:width .3s}
.bt-c{height:0;display:grid;place-items:center;font-family:var(--f-t);font-size:3.2rem;font-weight:700;color:#fff;opacity:0}
.bt-c.on{height:84px;opacity:1;animation:btPop .5s cubic-bezier(.2,.9,.2,1.3)}
@keyframes btPop{from{transform:scale(2.2);opacity:0;filter:blur(6px)}}
.boot.lift .bt-box{animation:btLift .8s cubic-bezier(.6,0,.2,1) forwards}
@keyframes btLift{to{transform:translateY(-120vh) scale(.9)}}
.bt-skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));font-size:.72rem;color:#4B6A85;letter-spacing:.08em}

textarea.io{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--sheet2);color:var(--ink);font-family:var(--f-c);font-size:.75rem;padding:10px}
/* modale et toast */
.fo-modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(3,4,12,.6);backdrop-filter:blur(6px)}
.fo-modal .box{width:min(440px,100%);background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:20px;animation:pop .35s}
.fo-modal h2{font-family:var(--f-t);margin:0 0 8px;font-size:1.3rem}
.fo-modal p{color:var(--ink2);margin:0 0 6px}
.fo-modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.fo-modal .row .btnx{flex:1}
.fo-toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;max-width:min(92vw,460px);padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:700;font-size:.88rem;box-shadow:0 18px 40px -16px #000;animation:pop .3s}
.badge3d{width:120px;height:120px;margin:4px auto 10px;display:grid;place-items:center;border-radius:30px;transform:rotate(45deg);background:conic-gradient(from 0deg,var(--acc),var(--acc2),#F472B6,var(--acc));animation:spinb 6s linear infinite;box-shadow:0 20px 50px -18px var(--acc)}
.badge3d span{transform:rotate(-45deg);font-family:var(--f-t);font-weight:700;color:#0B0B1A;font-size:.9rem;text-align:center;line-height:1.1;padding:0 10px}
@keyframes spinb{50%{filter:hue-rotate(40deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.sec-t{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;justify-content:space-between;margin:22px 2px 6px}
.sec-t h2{font-family:var(--f-t);font-size:1.3rem;margin:0}.sec-t span{color:var(--ink2);font-size:.8rem;font-weight:700}
.note{font-size:.78rem;color:var(--ink3);margin-top:8px}
html[data-motion="off"] .fo *{animation:none!important}
