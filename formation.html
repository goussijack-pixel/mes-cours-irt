r", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">def<\/span> frais_transfert(montant: int, taux: float = <span class=\"k4\">0.01<\/span>) -&gt; int:<\/span><span class=\"ln\" data-n=\"2\">    <span class=\"k3\">&quot;&quot;<\/span><span class=\"k3\">&quot;Frais d&#x27;un transfert PyMoney (1 % par défaut).&quot;<\/span><span class=\"k3\">&quot;&quot;<\/span><\/span><span class=\"ln\" data-n=\"3\">    <span class=\"k1\">return<\/span> round(montant * taux)<\/span><span class=\"ln\" data-n=\"4\"> <\/span><span class=\"ln\" data-n=\"5\"><span class=\"k1\">print<\/span>(frais_transfert(<span class=\"k4\">8000<\/span>))          <span class=\"k5\"># 80<\/span><\/span><span class=\"ln\" data-n=\"6\"><span class=\"k1\">print<\/span>(frais_transfert(<span class=\"k4\">8000<\/span>, <span class=\"k4\">0.02<\/span>))    <span class=\"k5\"># 160<\/span><\/span><\/pre><\/figure>\n<figure class=\"code\" style=\"background:var(--sheet);color:var(--ink);padding:12px 6px\"><svg viewBox=\"0 0 340 90\" role=\"img\" aria-label=\"Une fonction : des entrées entrent, un calcul se fait, une sortie ressort\" style=\"width:100%;height:auto;display:block;font-family:var(--f-x)\">\n<g font-size=\"10.5\" font-weight=\"800\" text-anchor=\"middle\">\n<rect x=\"6\" y=\"28\" width=\"86\" height=\"34\" rx=\"8\" fill=\"var(--sheet2)\" stroke=\"var(--line)\"/><text x=\"49\" y=\"49\" fill=\"var(--ink)\">montant, taux<\/text>\n<rect x=\"124\" y=\"16\" width=\"100\" height=\"58\" rx=\"14\" fill=\"#4B8BFF\"/><text x=\"174\" y=\"42\" fill=\"#fff\">frais_transfert<\/text><text x=\"174\" y=\"58\" fill=\"#fff\" font-size=\"9\" font-family=\"var(--f-c)\">round(m × t)<\/text>\n<rect x=\"256\" y=\"28\" width=\"78\" height=\"34\" rx=\"8\" fill=\"#22C55E\"/><text x=\"295\" y=\"49\" fill=\"#fff\">return 80<\/text><\/g>\n<g stroke=\"var(--ink2)\" stroke-width=\"2\"><path d=\"M92 45h30M224 45h30\"/><\/g><\/svg><\/figure>\n<div class=\"co piege\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-warn\"/><\/svg>print n'est pas return<\/div><div class=\"b\"><p><code>print<\/code> <strong>affiche<\/strong> pour un humain ; <code>return<\/code> <strong>renvoie<\/strong> une valeur au programme. Une fonction sans <code>return<\/code> renvoie <code>None<\/code>.<\/p><\/div><\/div>"}, {"t": "La portée : ce qui naît dans une fonction y meurt", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">def<\/span> calcul():<\/span><span class=\"ln\" data-n=\"2\">    temp = <span class=\"k4\">42<\/span>        <span class=\"k5\"># variable locale<\/span><\/span><span class=\"ln\" data-n=\"3\">    <span class=\"k1\">return<\/span> temp * <span class=\"k4\">2<\/span><\/span><span class=\"ln\" data-n=\"4\"><span class=\"k1\">print<\/span>(calcul())      <span class=\"k5\"># 84<\/span><\/span><span class=\"ln\" data-n=\"5\"><span class=\"k5\"># print(temp)        # NameError : temp n&#x27;existe pas ici<\/span><\/span><\/pre><\/figure>"}, {"t": "Les fonctions sont des valeurs", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\"\"><span class=\"ln\" data-n=\"1\">clients = [(<span class=\"k3\">&quot;Awa&quot;<\/span>, <span class=\"k4\">25000<\/span>), (<span class=\"k3\">&quot;Kofi&quot;<\/span>, <span class=\"k4\">8000<\/span>), (<span class=\"k3\">&quot;Fatou&quot;<\/span>, <span class=\"k4\">150000<\/span>)]<\/span><span class=\"ln\" data-n=\"2\"><span class=\"k1\">print<\/span>(sorted(clients, key=<span class=\"k1\">lambda<\/span> c: c[<span class=\"k4\">1<\/span>]))   <span class=\"k5\"># trié par solde<\/span><\/span><span class=\"ln\" data-n=\"3\"><span class=\"k1\">print<\/span>(max(clients, key=<span class=\"k1\">lambda<\/span> c: c[<span class=\"k4\">1<\/span>])[<span class=\"k4\">0<\/span>])   <span class=\"k5\"># Fatou<\/span><\/span><\/pre><\/figure>\n<div class=\"co retenir\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-star\"/><\/svg>Une bonne fonction<\/div><div class=\"b\"><p>Fait <strong>une seule chose<\/strong>, a un <strong>nom-verbe<\/strong> clair (<code>calculer_frais<\/code>), une <strong>docstring<\/strong>, et <strong>renvoie<\/strong> un résultat au lieu de l'afficher. Elle devient alors facile à tester (phase 5).<\/p><\/div><\/div>"}], "ex": [{"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["12"], "x": "double(3) = 6, puis double(6) = 12.", "code": "def double(x):\n    return x * 2\nprint(double(double(3)))"}, {"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["Salut Awa"], "x": "Le 2e argument remplace la valeur par défaut.", "code": "def salut(nom, poli=True):\n    return (\"Bonjour \" if poli else \"Salut \") + nom\nprint(salut(\"Awa\", False))"}, {"q": "Que va afficher ce code ?", "o": ["5 puis 5", "5 puis None", "None puis 5"], "a": [1], "free": [], "x": "f affiche 5 mais ne renvoie rien : r vaut None.", "code": "def f(x):\n    print(x)\nr = f(5)\nprint(r)"}], "quiz": [{"q": "Quel mot-clé renvoie une valeur ?", "o": ["<code>return<\/code>", "<code>print<\/code>", "<code>yield<\/code>"], "a": [0], "free": [], "x": "yield existe aussi (générateurs) mais c'est return qu'on utilise ici."}, {"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["[3, 2, 1]"], "x": "Trier selon -x revient à trier en ordre décroissant.", "code": "print(sorted([3, 1, 2], key=lambda x: -x))"}, {"q": "Une variable créée dans une fonction est…", "o": ["Locale : elle n'existe que pendant l'appel", "Globale", "Partagée avec tout le programme"], "a": [0], "free": [], "x": "C'est la portée (scope)."}, {"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["20"], "x": "10 + 10.", "code": "def aire(l, L=2):\n    return l * L\nprint(aire(5) + aire(1, 10))"}, {"q": "À quoi sert une docstring ?", "o": ["À accélérer la fonction", "À documenter ce que fait la fonction", "À la rendre privée"], "a": [1], "free": [], "x": "<code>&quot;&quot;&quot;...&quot;&quot;&quot;<\/code> juste sous le def."}], "projet": [], "res": "<ul><li>Cours Python de l'app, chapitre 4 (PyMoney v0.3).<\/li><\/ul>"}, {"id": "p1-fichiers", "t": "Fichiers et exceptions", "dev": false, "ok": true, "obj": ["Lire et écrire des fichiers texte, JSON et CSV", "Intercepter les exceptions avec try / except", "Lever ses propres exceptions"], "accroche": "Les données vivent dans des fichiers, et les fichiers sont imparfaits. Un programme pro lit, écrit et survit aux erreurs.", "notions": [{"t": "with open : ouvrir proprement", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">with<\/span> open(<span class=\"k3\">&quot;notes.txt&quot;<\/span>, <span class=\"k3\">&quot;w&quot;<\/span>, encoding=<span class=\"k3\">&quot;utf-8&quot;<\/span>) <span class=\"k1\">as<\/span> f:<\/span><span class=\"ln\" data-n=\"2\">    f.write(<span class=\"k3\">&quot;Awa;15\\nKofi;12\\n&quot;<\/span>)<\/span><span class=\"ln\" data-n=\"3\"><span class=\"k1\">with<\/span> open(<span class=\"k3\">&quot;notes.txt&quot;<\/span>, encoding=<span class=\"k3\">&quot;utf-8&quot;<\/span>) <span class=\"k1\">as<\/span> f:<\/span><span class=\"ln\" data-n=\"4\">    <span class=\"k1\">for<\/span> ligne <span class=\"k1\">in<\/span> f:<\/span><span class=\"ln\" data-n=\"5\">        nom, note = ligne.strip().split(<span class=\"k3\">&quot;;&quot;<\/span>)<\/span><span class=\"ln\" data-n=\"6\">        <span class=\"k1\">print<\/span>(nom, int(note))<\/span><\/pre><\/figure>\n<div class=\"co retenir\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-star\"/><\/svg>À retenir<\/div><div class=\"b\"><p><code>with<\/code> <strong>ferme le fichier automatiquement<\/strong>, même en cas d'erreur. Précise toujours <code>encoding=&quot;utf-8&quot;<\/code> pour que les accents survivent.<\/p><\/div><\/div>"}, {"t": "JSON et CSV : les deux formats de l'IA", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">import<\/span> json, csv<\/span><span class=\"ln\" data-n=\"2\">donnees = {<span class=\"k3\">&quot;nom&quot;<\/span>: <span class=\"k3\">&quot;Awa&quot;<\/span>, <span class=\"k3\">&quot;notes&quot;<\/span>: [<span class=\"k4\">15<\/span>, <span class=\"k4\">12<\/span>]}<\/span><span class=\"ln\" data-n=\"3\"><span class=\"k1\">with<\/span> open(<span class=\"k3\">&quot;awa.json&quot;<\/span>, <span class=\"k3\">&quot;w&quot;<\/span>, encoding=<span class=\"k3\">&quot;utf-8&quot;<\/span>) <span class=\"k1\">as<\/span> f:<\/span><span class=\"ln\" data-n=\"4\">    json.dump(donnees, f, ensure_ascii=<span class=\"k1\">False<\/span>, indent=<span class=\"k4\">2<\/span>)<\/span><span class=\"ln\" data-n=\"5\"><span class=\"k1\">with<\/span> open(<span class=\"k3\">&quot;awa.json&quot;<\/span>, encoding=<span class=\"k3\">&quot;utf-8&quot;<\/span>) <span class=\"k1\">as<\/span> f:<\/span><span class=\"ln\" data-n=\"6\">    <span class=\"k1\">print<\/span>(json.load(f)[<span class=\"k3\">&quot;notes&quot;<\/span>])          <span class=\"k5\"># [15, 12]<\/span><\/span><span class=\"ln\" data-n=\"7\"><span class=\"k1\">with<\/span> open(<span class=\"k3\">&quot;notes.csv&quot;<\/span>, <span class=\"k3\">&quot;w&quot;<\/span>, newline=<span class=\"k3\">&quot;&quot;<\/span>, encoding=<span class=\"k3\">&quot;utf-8-sig&quot;<\/span>) <span class=\"k1\">as<\/span> f:<\/span><span class=\"ln\" data-n=\"8\">    csv.writer(f, delimiter=<span class=\"k3\">&quot;;&quot;<\/span>).writerows([[<span class=\"k3\">&quot;nom&quot;<\/span>, <span class=\"k3\">&quot;note&quot;<\/span>], [<span class=\"k3\">&quot;Awa&quot;<\/span>, <span class=\"k4\">15<\/span>]])<\/span><\/pre><\/figure>"}, {"t": "Les exceptions : prévoir l'imprévu", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\">saisie = <span class=\"k3\">&quot;douze&quot;<\/span><\/span><span class=\"ln\" data-n=\"2\"><span class=\"k1\">try<\/span>:<\/span><span class=\"ln\" data-n=\"3\">    note = int(saisie)<\/span><span class=\"ln\" data-n=\"4\"><span class=\"k1\">except<\/span> ValueError:<\/span><span class=\"ln\" data-n=\"5\">    <span class=\"k1\">print<\/span>(<span class=\"k3\">&quot;Ce n&#x27;est pas un nombre&quot;<\/span>)<\/span><span class=\"ln\" data-n=\"6\"><span class=\"k1\">else<\/span>:<\/span><span class=\"ln\" data-n=\"7\">    <span class=\"k1\">print<\/span>(<span class=\"k3\">&quot;OK&quot;<\/span>, note)        <span class=\"k5\"># seulement si aucune erreur<\/span><\/span><span class=\"ln\" data-n=\"8\">finally:<\/span><span class=\"ln\" data-n=\"9\">    <span class=\"k1\">print<\/span>(<span class=\"k3\">&quot;Fin&quot;<\/span>)             <span class=\"k5\"># toujours exécuté<\/span><\/span><\/pre><\/figure>\n<div class=\"tbl\"><table><thead><tr><th>Exception<\/th><th>Quand ?<\/th><\/tr><\/thead><tbody><tr><td><code>ValueError<\/code><\/td><td><code>int(&quot;abc&quot;)<\/code><\/td><\/tr><tr><td><code>ZeroDivisionError<\/code><\/td><td><code>1 / 0<\/code><\/td><\/tr><tr><td><code>KeyError<\/code><\/td><td><code>d[&quot;clé_absente&quot;]<\/code><\/td><\/tr><tr><td><code>IndexError<\/code><\/td><td><code>[1, 2][5]<\/code><\/td><\/tr><tr><td><code>FileNotFoundError<\/code><\/td><td>ouvrir un fichier absent<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"co piege\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-warn\"/><\/svg>Piège classique<\/div><div class=\"b\"><p>Ne jamais écrire <code>except:<\/code> tout seul : il avale <strong>toutes<\/strong> les erreurs, même celles qui révèlent un bug. Intercepte l'exception <strong>précise<\/strong> que tu attends.<\/p><\/div><\/div>"}, {"t": "Lever ses propres exceptions", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">class<\/span> OperationRefusee(Exception):<\/span><span class=\"ln\" data-n=\"2\">    pass<\/span><span class=\"ln\" data-n=\"3\"><span class=\"k1\">def<\/span> retirer(solde, montant):<\/span><span class=\"ln\" data-n=\"4\">    <span class=\"k1\">if<\/span> montant &gt; solde:<\/span><span class=\"ln\" data-n=\"5\">        raise OperationRefusee(<span class=\"k3\">&quot;Solde insuffisant&quot;<\/span>)<\/span><span class=\"ln\" data-n=\"6\">    <span class=\"k1\">return<\/span> solde - montant<\/span><\/pre><\/figure>"}], "ex": [{"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["division par zéro"], "x": "L'exception est interceptée.", "code": "try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print(\"division par zéro\")"}, {"q": "Quelle exception lève <code>int(&quot;12a&quot;)<\/code> ?", "o": ["ValueError", "TypeError", "KeyError"], "a": [0], "free": [], "x": "La valeur n'est pas convertible."}, {"q": "Que va afficher ce code ?", "o": ["erreur puis fin", "14 puis fin", "fin seulement"], "a": [1], "free": [], "x": "Pas d'erreur : else s'exécute, puis finally.", "code": "try:\n    x = int(\"7\")\nexcept ValueError:\n    print(\"erreur\")\nelse:\n    print(x * 2)\nfinally:\n    print(\"fin\")"}], "quiz": [{"q": "Pourquoi utiliser <code>with open(...)<\/code> ?", "o": ["Le fichier est fermé automatiquement, même en cas d'erreur", "C'est plus rapide", "C'est obligatoire pour lire"], "a": [0], "free": [], "x": "Bonne pratique universelle."}, {"q": "Quel module lit et écrit le format des API web ?", "o": [], "a": [], "free": ["json"], "x": "JSON est partout : API, configuration, réponses des LLM."}, {"q": "<code>[1, 2][5]<\/code> lève…", "o": ["KeyError", "IndexError", "ValueError"], "a": [1], "free": [], "x": "Indice hors de la liste."}, {"q": "Que fait <code>raise<\/code> ?", "o": ["Déclenche une exception", "Ignore une erreur", "Ferme le programme proprement"], "a": [0], "free": [], "x": "On signale une règle violée."}, {"q": "Pourquoi éviter <code>except:<\/code> tout seul ?", "o": ["Il est trop lent", "Il cache tous les bugs, même ceux qu'on n'attendait pas", "Il n'existe pas"], "a": [1], "free": [], "x": "Toujours une exception précise."}], "projet": [], "res": "<ul><li>Cours Python de l'app, chapitre 6 (PyMoney v0.5, jalon noté).<\/li><\/ul>"}, {"id": "p1-modules", "t": "Modules, uv et environnement", "dev": false, "ok": true, "obj": ["Importer des modules de la bibliothèque standard", "Créer tes propres modules et utiliser if __name__ == \"__main__\"", "Gérer un projet et ses dépendances avec uv"], "accroche": "Personne ne code une IA tout seul from scratch : on assemble des bibliothèques. Savoir les importer, les installer et découper son propre code est la base du métier.", "notions": [{"t": "Importer", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">import<\/span> math<\/span><span class=\"ln\" data-n=\"2\"><span class=\"k1\">from<\/span> datetime <span class=\"k1\">import<\/span> datetime, timedelta<\/span><span class=\"ln\" data-n=\"3\"><span class=\"k1\">import<\/span> random <span class=\"k1\">as<\/span> rd<\/span><span class=\"ln\" data-n=\"4\"><span class=\"k1\">print<\/span>(math.sqrt(<span class=\"k4\">16<\/span>), rd.randint(<span class=\"k4\">1<\/span>, <span class=\"k4\">6<\/span>))<\/span><span class=\"ln\" data-n=\"5\"><span class=\"k1\">print<\/span>(datetime.now() + timedelta(days=<span class=\"k4\">7<\/span>))<\/span><\/pre><\/figure>\n<div class=\"tbl\"><table><thead><tr><th>Module standard<\/th><th>Pour…<\/th><\/tr><\/thead><tbody><tr><td><code>math<\/code><\/td><td>racine, arrondis, log<\/td><\/tr><tr><td><code>random<\/code><\/td><td>hasard, données de test<\/td><\/tr><tr><td><code>datetime<\/code><\/td><td>dates et durées<\/td><\/tr><tr><td><code>json<\/code>, <code>csv<\/code><\/td><td>fichiers<\/td><\/tr><tr><td><code>pathlib<\/code>, <code>os<\/code><\/td><td>chemins et dossiers<\/td><\/tr><tr><td><code>statistics<\/code><\/td><td>moyenne, médiane, écart-type<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Découper ton projet en modules", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Texte<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\"\"><span class=\"ln\" data-n=\"1\">pymoney/<\/span><span class=\"ln\" data-n=\"2\">├── main.py          ← le menu<\/span><span class=\"ln\" data-n=\"3\">├── regles.py        ← constantes et calculs<\/span><span class=\"ln\" data-n=\"4\">└── operations.py    ← deposer(), retirer()<\/span><\/pre><\/figure>\n<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k5\"># operations.py<\/span><\/span><span class=\"ln\" data-n=\"2\"><span class=\"k1\">from<\/span> regles <span class=\"k1\">import<\/span> frais_retrait<\/span><span class=\"ln\" data-n=\"3\"><span class=\"k1\">def<\/span> retirer(compte, montant): ...<\/span><span class=\"ln\" data-n=\"4\"> <\/span><span class=\"ln\" data-n=\"5\"><span class=\"k1\">if<\/span> __name__ == <span class=\"k3\">&quot;__main__&quot;<\/span>:   <span class=\"k5\"># ne s&#x27;exécute que si on lance ce fichier directement<\/span><\/span><span class=\"ln\" data-n=\"6\">    <span class=\"k1\">print<\/span>(<span class=\"k3\">&quot;test rapide&quot;<\/span>)<\/span><\/pre><\/figure>\n<div class=\"co retenir\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-star\"/><\/svg><code>__name__<\/code><\/div><div class=\"b\"><p>Quand un fichier est <strong>lancé<\/strong>, <code>__name__<\/code> vaut <code>&quot;__main__&quot;<\/code>. Quand il est <strong>importé<\/strong>, il vaut le nom du module. Ce test évite que ton code de démonstration s'exécute à chaque import.<\/p><\/div><\/div>"}, {"t": "uv : un environnement propre par projet", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Terminal<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\"sh\"><span class=\"ln o\">uv init mon-projet<\/span><span class=\"ln o\">cd mon-projet<\/span><span class=\"ln o\">uv add pandas scikit-learn     # installe + note dans pyproject.toml + fige dans uv.lock<\/span><span class=\"ln o\">uv run main.py<\/span><span class=\"ln o\">uv sync                        # sur une autre machine : même environnement<\/span><\/pre><\/figure>\n<div class=\"co tip\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-bulb\"/><\/svg>Pourquoi un environnement par projet ?<\/div><div class=\"b\"><p>Le projet A veut pandas 1.5, le projet B pandas 2.2. Sans environnements séparés, l'un casse l'autre. C'est le même esprit que Docker.<\/p><\/div><\/div>"}], "ex": [{"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["10"], "x": "floor(7.9) = 7 et ceil(2.1) = 3.", "code": "import math\nprint(math.floor(7.9) + math.ceil(2.1))"}, {"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["5"], "x": "Trié : 1, 3, 5, 7, 9. Le milieu est 5.", "code": "import statistics\nprint(statistics.median([3, 9, 1, 7, 5]))"}, {"q": "Quelle commande ajoute pandas à ton projet uv ?", "o": [], "a": [], "free": ["uv add pandas"], "x": "Elle installe et note la dépendance."}], "quiz": [{"q": "Quand <code>__name__<\/code> vaut-il <code>&quot;__main__&quot;<\/code> ?", "o": ["Quand le fichier est lancé directement", "Quand il est importé", "Toujours"], "a": [0], "free": [], "x": "Importé, il vaut le nom du module."}, {"q": "Quel fichier fige les versions exactes des dépendances avec uv ?", "o": ["README.md", "uv.lock", "main.py"], "a": [1], "free": [], "x": "Reproductibilité garantie."}, {"q": "<code>from datetime import datetime<\/code> permet d'écrire…", "o": ["<code>datetime.now()<\/code>", "<code>datetime.datetime.now()<\/code> obligatoirement", "<code>now()<\/code>"], "a": [0], "free": [], "x": "On importe directement la classe."}, {"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["20"], "x": "(10 + 20 + 30) / 3.", "code": "from statistics import mean\nprint(mean([10, 20, 30]))"}, {"q": "Pourquoi un environnement virtuel par projet ?", "o": ["Pour aller plus vite", "Pour que les versions de bibliothèques d'un projet ne cassent pas l'autre", "Parce que Windows l'exige"], "a": [1], "free": [], "x": "Isolation des dépendances."}], "projet": [], "res": "<ul><li>Cours Python de l'app, chapitre 5 ; <a href=\"https://docs.astral.sh/uv/\">documentation uv<\/a>.<\/li><\/ul>"}, {"id": "p1-classes", "t": "Classes et objets en Python", "dev": false, "ok": true, "obj": ["Écrire une classe avec __init__, attributs et méthodes", "Utiliser l'héritage", "Reconnaître la POO dans les bibliothèques d'IA"], "accroche": "Tu connais déjà la POO en Java. En Python, c'est la même idée, en plus court, et c'est ainsi que sont construits PyTorch et scikit-learn.", "notions": [{"t": "Une classe Python, comparée à Java", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">class<\/span> Compte:<\/span><span class=\"ln\" data-n=\"2\">    <span class=\"k1\">def<\/span> __init__(<span class=\"k1\">self<\/span>, numero: str, solde: int = <span class=\"k4\">0<\/span>):<\/span><span class=\"ln\" data-n=\"3\">        <span class=\"k1\">self<\/span>.numero = numero<\/span><span class=\"ln\" data-n=\"4\">        <span class=\"k1\">self<\/span>.solde = solde<\/span><span class=\"ln\" data-n=\"5\"> <\/span><span class=\"ln\" data-n=\"6\">    <span class=\"k1\">def<\/span> deposer(<span class=\"k1\">self<\/span>, montant: int) -&gt; <span class=\"k1\">None<\/span>:<\/span><span class=\"ln\" data-n=\"7\">        <span class=\"k1\">if<\/span> montant &lt; <span class=\"k4\">100<\/span>:<\/span><span class=\"ln\" data-n=\"8\">            raise ValueError(<span class=\"k3\">&quot;Minimum 100 FCFA&quot;<\/span>)<\/span><span class=\"ln\" data-n=\"9\">        <span class=\"k1\">self<\/span>.solde += montant<\/span><span class=\"ln\" data-n=\"10\"> <\/span><span class=\"ln\" data-n=\"11\">    <span class=\"k1\">def<\/span> __repr__(<span class=\"k1\">self<\/span>):<\/span><span class=\"ln\" data-n=\"12\">        <span class=\"k1\">return<\/span> f<span class=\"k3\">&quot;Compte({self.numero}, {self.solde} FCFA)&quot;<\/span><\/span><span class=\"ln\" data-n=\"13\"> <\/span><span class=\"ln\" data-n=\"14\">c = Compte(<span class=\"k3\">&quot;0197123456&quot;<\/span>, <span class=\"k4\">25000<\/span>)<\/span><span class=\"ln\" data-n=\"15\">c.deposer(<span class=\"k4\">5000<\/span>)<\/span><span class=\"ln\" data-n=\"16\"><span class=\"k1\">print<\/span>(c)          <span class=\"k5\"># Compte(0197123456, 30000 FCFA)<\/span><\/span><\/pre><\/figure>\n<div class=\"tbl\"><table><thead><tr><th>Java<\/th><th>Python<\/th><\/tr><\/thead><tbody><tr><td>constructeur <code>Compte(...)<\/code><\/td><td><code>__init__(self, ...)<\/code><\/td><\/tr><tr><td><code>this.solde<\/code><\/td><td><code>self.solde<\/code><\/td><\/tr><tr><td><code>toString()<\/code><\/td><td><code>__repr__<\/code> / <code>__str__<\/code><\/td><\/tr><tr><td><code>extends<\/code><\/td><td><code>class Epargne(Compte):<\/code><\/td><\/tr><tr><td><code>private<\/code><\/td><td>convention : <code>_solde<\/code> (un tiret bas)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"co retenir\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-star\"/><\/svg>self<\/div><div class=\"b\"><p><code>self<\/code> est l'objet lui-même. Il est <strong>le premier paramètre de chaque méthode<\/strong>, et Python le passe automatiquement : on écrit <code>c.deposer(5000)<\/code>, pas <code>c.deposer(c, 5000)<\/code>.<\/p><\/div><\/div>"}, {"t": "Héritage", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">class<\/span> Epargne(Compte):<\/span><span class=\"ln\" data-n=\"2\">    <span class=\"k1\">def<\/span> __init__(<span class=\"k1\">self<\/span>, numero, solde=<span class=\"k4\">0<\/span>, taux=<span class=\"k4\">0.03<\/span>):<\/span><span class=\"ln\" data-n=\"3\">        super().__init__(numero, solde)<\/span><span class=\"ln\" data-n=\"4\">        <span class=\"k1\">self<\/span>.taux = taux<\/span><span class=\"ln\" data-n=\"5\">    <span class=\"k1\">def<\/span> interets(<span class=\"k1\">self<\/span>):<\/span><span class=\"ln\" data-n=\"6\">        <span class=\"k1\">return<\/span> round(<span class=\"k1\">self<\/span>.solde * <span class=\"k1\">self<\/span>.taux)<\/span><span class=\"ln\" data-n=\"7\">e = Epargne(<span class=\"k3\">&quot;0166554433&quot;<\/span>, <span class=\"k4\">100000<\/span>)<\/span><span class=\"ln\" data-n=\"8\"><span class=\"k1\">print<\/span>(e.interets())   <span class=\"k5\"># 3000<\/span><\/span><\/pre><\/figure>"}, {"t": "Le lien avec l'IA", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Python<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\" n\"><span class=\"ln\" data-n=\"1\"><span class=\"k1\">from<\/span> sklearn.linear_model <span class=\"k1\">import<\/span> LinearRegression<\/span><span class=\"ln\" data-n=\"2\">modele = LinearRegression()   <span class=\"k5\"># un objet<\/span><\/span><span class=\"ln\" data-n=\"3\">modele.fit(X, y)              <span class=\"k5\"># une méthode qui entraîne<\/span><\/span><span class=\"ln\" data-n=\"4\">modele.predict(X_nouveau)     <span class=\"k5\"># une méthode qui prédit<\/span><\/span><\/pre><\/figure>\n<div class=\"co tip\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-bulb\"/><\/svg>Astuce<\/div><div class=\"b\"><p>Tout modèle scikit-learn est un <strong>objet<\/strong> avec les méthodes <code>fit<\/code> et <code>predict<\/code>. En PyTorch, tu écriras toi-même une classe qui <strong>hérite<\/strong> de <code>nn.Module<\/code>. La POO n'est pas un exercice d'école : c'est la forme de toutes les bibliothèques d'IA.<\/p><\/div><\/div>"}], "ex": [{"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["7"], "x": "3 + 4.", "code": "class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def somme(self):\n        return self.x + self.y\nprint(Point(3, 4).somme())"}, {"q": "Comment s'appelle le constructeur en Python ?", "o": [], "a": [], "free": ["__init__"], "x": "Il initialise les attributs de l'objet."}, {"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["A"], "x": "B hérite de la méthode de A.", "code": "class A:\n    def nom(self):\n        return \"A\"\nclass B(A):\n    pass\nprint(B().nom())"}], "quiz": [{"q": "En Python, l'équivalent de <code>this<\/code> est…", "o": ["me", "self", "this"], "a": [1], "free": [], "x": "Toujours le premier paramètre des méthodes."}, {"q": "Que va afficher ce code ?", "o": [], "a": [], "free": ["2"], "x": "Chaque appel renvoie l'objet, ce qui permet d'enchaîner.", "code": "class C:\n    def __init__(self):\n        self.n = 0\n    def plus(self):\n        self.n += 1\n        return \"Fichiers, git add, zone de préparation, git commit, dépôt local, git push, GitHub\" style=\"width:100%;height:auto;display:block;font-family:var(--f-x)\">\n<g font-size=\"10\" font-weight=\"800\" text-anchor=\"middle\">\n<rect x=\"4\" y=\"30\" width=\"70\" height=\"34\" rx=\"8\" fill=\"var(--sheet2)\" stroke=\"var(--line)\"/><text x=\"39\" y=\"51\" fill=\"var(--ink)\">Fichiers<\/text>\n<rect x=\"92\" y=\"30\" width=\"70\" height=\"34\" rx=\"8\" fill=\"var(--sheet2)\" stroke=\"var(--line)\"/><text x=\"127\" y=\"51\" fill=\"var(--ink)\">Index<\/text>\n<rect x=\"180\" y=\"30\" width=\"70\" height=\"34\" rx=\"8\" fill=\"#4B8BFF\"/><text x=\"215\" y=\"51\" fill=\"#fff\">Dépôt local<\/text>\n<rect x=\"268\" y=\"30\" width=\"68\" height=\"34\" rx=\"8\" fill=\"var(--ink)\"/><text x=\"302\" y=\"51\" fill=\"var(--paper)\">GitHub<\/text><\/g>\n<g stroke=\"#F97316\" stroke-width=\"2\"><path d=\"M74 47h16M162 47h16M250 47h16\"/><\/g>\n<g font-size=\"9\" font-family=\"var(--f-c)\" fill=\"#F97316\" text-anchor=\"middle\"><text x=\"83\" y=\"22\">add<\/text><text x=\"171\" y=\"22\">commit<\/text><text x=\"259\" y=\"22\">push<\/text><\/g><\/svg><\/figure>"}, {"t": "Un bon message de commit", "h": "<div class=\"tbl\"><table><thead><tr><th>Mauvais<\/th><th>Bon<\/th><\/tr><\/thead><tbody><tr><td><code>modif<\/code><\/td><td><code>Ajoute le calcul des frais de retrait<\/code><\/td><\/tr><tr><td><code>fix<\/code><\/td><td><code>Corrige le refus des retraits de 500 000 FCFA<\/code><\/td><\/tr><tr><td><code>aaaa<\/code><\/td><td><code>Ajoute les tests du transfert<\/code><\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": ".gitignore et secrets", "h": "<figure class=\"code\"><div class=\"code-h\"><span class=\"l\"><span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>Texte<\/span><button class=\"copy\" data-copy aria-label=\"Copier le code\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-copy\"/><\/svg>Copier<\/button><\/div><pre class=\"\"><span class=\"ln\" data-n=\"1\">.venv/<\/span><span class=\"ln\" data-n=\"2\">__pycache__/<\/span><span class=\"ln\" data-n=\"3\">.env<\/span><span class=\"ln\" data-n=\"4\">*.log<\/span><span class=\"ln\" data-n=\"5\">data/brutes/<\/span><\/pre><\/figure>\n<div class=\"co piege\"><div class=\"k\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-warn\"/><\/svg>La faute qui coûte cher<\/div><div class=\"b\"><p>Une clé d'API poussée sur GitHub est <strong>trouvée par des robots en quelques minutes<\/strong>. Les secrets vont dans un fichier <code>.env<\/code> (listé dans <code>.gitignore<\/code>), lu avec <code>os.getenv(&quot;MA_CLE&quot;)<\/code>. Si une clé a fuité : <strong>révoque-la immédiatement<\/strong>, la supprimer du dépôt ne suffit pas.<\/p><\/div><\/div>"}, {"t": "Le README qui donne envie", "h": "<ol class=\"steps\"><li>1. <strong>Titre et une phrase<\/strong> : ce que fait le projet.<\/li><li>2. <strong>Une capture d'écran<\/strong> ou un GIF.<\/li><li>3. <strong>Installation<\/strong> : <code>uv sync<\/code> puis <code>uv run main.py<\/code>.<\/li><li>4. <strong>Ce que j'ai appris<\/strong> : 3 points.<\/li><li>5. <strong>Prochaines étapes<\/strong>.<\/li><\/ol>"}], "ex": [{"q": "Quelle commande prépare tous les fichiers modifiés pour le prochain commit ?", "o": [], "a": [], "free": ["git add ."], "x": "Le point désigne le dossier courant."}, {"q": "Quel fichier liste ce que Git doit ignorer ?", "o": [], "a": [], "free": [".gitignore"], "x": "On y met .venv, .env, les gros fichiers de données."}, {"q": "Une clé d'API a été poussée sur GitHub par erreur. Première chose à faire ?", "o": ["Supprimer le fichier et refaire un commit", "Révoquer la clé immédiatement", "Rendre le dépôt privé et attendre"], "a": [1], "free": [], "x": "L'historique Git garde la clé ; seule la révocation la rend inutile."}], "quiz": [{"q": "Dans quel ordre ?", "o": ["add, commit, push", "push, add, commit", "commit, add, push"], "a": [0], "free": [], "x": "Préparer, enregistrer, publier."}, {"q": "Où ranger une clé d'API
